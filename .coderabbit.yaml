language: ko-KR
tone_instructions: >
  함께 성장하는 동료 개발자의 관점에서 리뷰해주세요.
  결론을 먼저 말하고, 문제의 원인과 예상되는 영향을 간결하게 설명해주세요.
  근거가 필요한 경우 관련 공식 문서 링크를 첨부해주세요.
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: false

  review_status: true
  review_details: false
  review_progress: true

  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  enable_prompt_for_ai_agents: false
  abort_on_close: true
  disable_cache: false

  # 추후에 경로에 따라 instructions customizing 가능
  # path_instructions:
  # - path: "src/controllers/**"
  #   instructions: |
  #     - 인증과 권한 검사가 누락되지 않았는지 확인해주세요.
  #     - 사용자 입력값의 검증 여부를 확인해주세요.
  #     - ORM을 우회하는 직접 데이터베이스 접근을 지적해주세요.

  # 리뷰를 건너뛸 대상
  path_filters:
    # 저장소에 설치된 외부 에이전트 스킬
    - '!.agents/skills/**'
    - '!.claude/skills/**'

    # Spec Kit가 설치·생성한 공통 리소스
    - '!.specify/**'

    # 설치된 스킬 버전 잠금 파일
    - '!skills-lock.json'
