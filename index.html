<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>oh-my-ebook</title>
    <meta
      name="description"
      content="PDF와 전자책을 읽으며 AI에게 바로 질문할 수 있는 리더 oh-my-ebook"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="oh-my-ebook" />
    <meta
      property="og:description"
      content="PDF와 전자책을 읽으며 AI에게 바로 질문할 수 있는 리더 oh-my-ebook"
    />
    <meta property="og:url" content="https://oh-my-ebook.vercel.app" />
    <meta property="og:image" content="https://oh-my-ebook.vercel.app/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="oh-my-ebook" />
    <meta
      name="twitter:description"
      content="PDF와 전자책을 읽으며 AI에게 바로 질문할 수 있는 리더 oh-my-ebook"
    />
    <meta name="twitter:image" content="https://oh-my-ebook.vercel.app/og-image.png" />
    <script>
      // React가 로드되기 전 첫 화면에도 저장된 테마 또는 시스템 테마를 적용한다.
      ;(() => {
        let theme
        try {
          theme = localStorage.getItem('theme')
        } catch {
          // 저장소가 차단되면 시스템 설정을 따른다.
        }
        document.documentElement.classList.toggle(
          'dark',
          theme === 'dark' ||
            (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches),
        )
      })()
    </script>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
