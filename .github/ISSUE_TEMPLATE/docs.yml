name: 📝 문서 개선
description: README, 개발 가이드나 Spec Kit 문서에서 보완할 내용을 알려주세요.
title: '[문서] '
labels: ['documentation']
body:
  - type: input
    id: location
    attributes:
      label: 문서 위치
      description: 파일 경로나 링크를 적어주세요.
      placeholder: README.md, AGENTS.md, DESIGN.md, .specify/memory/constitution.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 수정이 필요한 내용
      description: 잘못되었거나 빠진 내용, 이해하기 어려운 부분을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 수정 제안
      description: 제안할 문구나 참고 자료가 있다면 적어주세요.
