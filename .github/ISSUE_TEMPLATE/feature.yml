name: ✨ 기능·개선 제안
description: 웹 앱 기능, UI 개선, 리팩터링이나 개발 도구 변경을 제안해 주세요.
title: '[기능] '
labels: ['enhancement']
body:
  - type: textarea
    id: what
    attributes:
      label: 제안하고 싶은 것
      description: 무엇을 제안하고 싶나요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용과 완료 기준
      description: 원하는 변경과 완료 여부를 확인할 수 있는 동작이나 결과를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: 참고 자료
      description: 관련 이슈, 화면 예시나 Spec Kit 문서(spec.md·plan.md·tasks.md)가 있다면 연결해 주세요.
