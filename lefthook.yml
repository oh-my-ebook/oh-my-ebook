pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}'
      run: pnpm exec oxlint --deny-warnings {staged_files}
    format:
      run: pnpm exec prettier --check --ignore-unknown {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit "{1}"

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
